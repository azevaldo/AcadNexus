<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IP ACADÉMICO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans antialiased">

    <div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-96 h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>

        <div class="max-w-md w-full relative">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-700 text-white rounded-2xl shadow-lg mb-4">
                    <i class="fas fa-university text-2xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-blue-950 tracking-tight">IP ACADÉMICO</h1>
                <p class="text-gray-500 mt-2 font-medium">Portal de Gestão de Anteprojetos e TCC</p>
            </div>

            <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white p-8 md:p-10">
                <form action="#" method="POST" class="space-y-6">
                    
                    <div>
                        <label for="email" class="block text-sm font-semibold text-blue-950 mb-2">E-mail Institucional</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="far fa-envelope"></i>
                            </span>
                            <input type="email" id="email" name="email" required 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition-all placeholder:text-gray-400 text-gray-700" 
                                placeholder="exemplo@isp.ao">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="password" class="block text-sm font-semibold text-blue-950">Palavra-passe</label>
                            <a href="#" class="text-xs font-bold text-blue-700 hover:text-blue-800 transition">Esqueceu-se?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="password" name="password" required 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition-all placeholder:text-gray-400 text-gray-700" 
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="remember" class="ml-2 text-sm text-gray-600">Manter sessão iniciada</label>
                    </div>

                    <button type="submit" 
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-0.5 active:scale-[0.98] flex items-center justify-center">
                        <span>Iniciar Sessão</span>
                        <i class="fas fa-sign-in-alt ml-2"></i>
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                    <p class="text-xs text-gray-500 leading-relaxed uppercase tracking-wider">
                        Acesso Restrito <br>
                        <span class="font-bold text-gray-400 text-[10px]">Utilize as credenciais fornecidas pela Secretaria</span>
                    </p>
                </div>
            </div>

            <p class="text-center mt-8 text-sm text-gray-400">
                &copy; 2026 IP ACADÉMICO. Todos os direitos reservados.
            </p>
        </div>
    </div>

    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</body>
</html>
